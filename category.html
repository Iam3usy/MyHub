<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Category Videos</title>
    
    <!-- Google Font နဲ့ CSS ချိတ်ဆက်ခြင်း -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div style="padding: 0 20px 20px; font-size: 24px; font-weight: bold; color: #fff;">Menu</div>
        <a href="index.html"><span class="icon">🏠</span> Home</a>
        <a href="categories.html" class="active"><span class="icon">🎬</span> Categories</a>
        <a href="models.html"><span class="icon">👤</span> Models</a>
        <a href="vip.html" style="color: gold;"><span class="icon">👑</span> VIP Videos</a>
        <hr style="border-color: #333; margin: 10px 0;">
        
        <!-- Login ဝင်ထားလား မဝင်ထားဘူး စစ်ပြီး ပြမယ် -->
        <a href="login.html" id="navLogin" style="color: #00d2ff;"><span class="icon">🔑</span> Login</a>
        <a href="account.html" id="navAccount" style="display: none; color: #00ff88;"><span class="icon">👤</span> My Account</a>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Navbar -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <a href="categories.html" style="color: white; text-decoration: none; font-size: 24px; margin-right: 10px;">&#8592;</a>
        <h1 class="logo" id="pageTitle">ဇာတ်ကားများ</h1>
    </div>

    <!-- Content -->
    <div class="container">
        <div class="grid" id="videoGrid">
            <!-- Loading Spinner Center -->
            <div class="loading-wrapper" style="grid-column: span 2;">
                <div class="spinner"></div>
                <p>ခဏစောင့်ပါ...</p>
            </div>
        </div>
    </div>

    <!-- Custom Error Popup -->
    <div id="customPopup">
        <div class="popup-content">
            <div class="popup-icon">⚠️</div>
            <div class="popup-title">Error တက်နေပါတယ်</div>
            <div class="popup-message" id="popupMsg">ဒေတာ ဆွဲထုတ်မရပါဘူး။</div>
            <button class="popup-btn" onclick="retryLoad()">ပြန်ကြိုးစားမည် (Retry)</button>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal">
        <button id="closeBtn" onclick="closePlayer()">✕</button>
        <video id="mainPlayer" controls playsinline></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev"; // မင်း Worker Link
        const urlParams = new URLSearchParams(window.location.search);
        const catId = urlParams.get('id');
        const catName = urlParams.get('name');

        if(catName) document.getElementById('pageTitle').innerText = catName;

        // Sidebar မှာ Login/Account ပြဖို့ စစ်ဆေးခြင်း
        if (localStorage.getItem('username')) {
            document.getElementById('navLogin').style.display = 'none';
            document.getElementById('navAccount').style.display = 'flex'; 
        }

        // Sidebar အဖွင့်အပိတ်
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        // Error Popup ပြမယ့် Function
        function showErrorPopup(message) {
            document.getElementById('popupMsg').innerText = message;
            document.getElementById('customPopup').style.display = 'flex';
        }

        // Retry နှိပ်ရင် လုပ်မယ့်အလုပ်
        function retryLoad() {
            document.getElementById('customPopup').style.display = 'none';
            document.getElementById('videoGrid').innerHTML = `
                <div class="loading-wrapper" style="grid-column: span 2;">
                    <div class="spinner"></div>
                    <p>ခဏစောင့်ပါ...</p>
                </div>`;
            loadVideos();
        }

        // ဇာတ်ကားများ ဆွဲထုတ်ခြင်း
        async function loadVideos() {
            if(!catId) {
                document.getElementById('videoGrid').innerHTML = '<p style="grid-column: span 2; text-align:center;">Category ID မပါလာပါ။</p>';
                return;
            }

            const grid = document.getElementById('videoGrid');
            
            try {
                const res = await fetch(`${API_URL}/api/videos/category?id=${catId}`);
                if (!res.ok) throw new Error("ဆာဗာကနေ ဒေတာ မပေးနိုင်ပါဘူး");

                const videos = await res.json();
                grid.innerHTML = ''; // Loading ကို ဖျက်မယ်
                
                if(videos.length === 0) {
                    grid.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#888;">ဒီ Category မှာ ဇာတ်ကား မရှိသေးပါ။</p>';
                    return;
                }

                videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playVideo(video.file_id);
                    card.innerHTML = `
                        <video src="${video.preview_url || ''}" autoplay loop muted playsinline></video>
                        <div class="title">${video.title}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = ''; 
                showErrorPopup(error.message); 
            }
        }

        // ဗီဒီယိုဖွင့်ခြင်း
        function playVideo(fileId) {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('mainPlayer');
            const streamUrl = `${API_URL}/stream?file_id=${fileId}`;
            modal.style.display = 'flex';

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
                window.currentHls = hls;
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() { video.play(); });
            }
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('mainPlayer');
            modal.style.display = 'none';
            video.pause();
            video.src = '';
            if(window.currentHls) window.currentHls.destroy();
        }

        // စာမျက်နှာ စတင်တာနဲ့ အလုပ်လုပ်မယ်
        loadVideos();
    </script>
</body>
</html>
