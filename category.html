<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Category Videos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
</head>
<body>
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <!-- 🔴 Profile -->
            <div class="profile-img" id="sidebarProfileImg" style="overflow: hidden;">👤</div>
            <h2>MyVideo</h2>
            <p>Premium Streaming</p>
        </div>

        <div class="sidebar-links">
            <a href="index.html"><span class="icon">🏠</span> Home </a>
            <a href="models.html"><span class="icon">👤</span> Models</a>
            <a href="categories.html" class="active"><span class="icon">🎬</span> Categories</a>
            <a href="popular.html" style="color: #00ff88;"><span class="icon">🔥</span> Popular</a>
            <a href="vip.html" style="color: gold;"><span class="icon">👑</span> VIP Videos</a>
            
            <div style="border-top: 1px solid #333; margin: 15px 10px;"></div>
            
            <a href="login.html" id="navLogin" style="color: #00d2ff;"><span class="icon">🔑</span> Login</a>
            <a href="account.html" id="navAccount" style="display: none; color: #00ff88;"><span class="icon">⚙️</span> My Account</a>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Navbar -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <a href="categories.html" style="color: white; text-decoration: none; font-size: 24px; margin-right: 10px;">&#8592;</a>
        <h1 class="logo" id="pageTitle">Videos</h1>
    </div>

    <!-- Content -->
    <div class="container">
        <div class="grid video-grid" id="videoGrid">
            <div class="loading-wrapper" style="grid-column: span 2;">
                <div class="spinner"></div>
                <p>Please Wait . . .</p>
            </div>
        </div>
    </div>

    <!-- Custom Error Popup -->
    <div id="customPopup">
        <div class="popup-content">
            <div class="popup-icon">⚠️</div>
            <div class="popup-title">Error</div>
            <div class="popup-message" id="popupMsg">Cannot connect to the server</div>
            <button class="popup-btn" onclick="retryLoad()">Retry</button>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal">
        <button id="closeBtn" onclick="closePlayer()">✕</button>
        <video id="mainPlayer" controls playsinline></video>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    
    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev"; 
        const urlParams = new URLSearchParams(window.location.search);
        const catId = urlParams.get('id');
        const catName = urlParams.get('name');
        let player; 

        if(catName) document.getElementById('pageTitle').innerText = catName;

        // 🔴 Sidebar
        if (localStorage.getItem('username')) {
            document.getElementById('navLogin').style.display = 'none';
            document.getElementById('navAccount').style.display = 'flex'; 
            
            const savedPic = localStorage.getItem('profile_pic');
            if (savedPic) {
                document.getElementById('sidebarProfileImg').innerHTML = `<img src="${savedPic}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
            }
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function showErrorPopup(message) {
            document.getElementById('popupMsg').innerText = message;
            document.getElementById('customPopup').style.display = 'flex';
        }

        function retryLoad() {
            document.getElementById('customPopup').style.display = 'none';
            document.getElementById('videoGrid').innerHTML = `
                <div class="loading-wrapper" style="grid-column: span 2;">
                    <div class="spinner"></div>
                    <p>Please Wait . . .</p>
                </div>`;
            loadVideos();
        }

        async function loadVideos() {
            if(!catId) {
                document.getElementById('videoGrid').innerHTML = '<p style="grid-column: span 2; text-align:center;">Category ID Error </p>';
                return;
            }

            const grid = document.getElementById('videoGrid');
            
            try {
                const res = await fetch(`${API_URL}/api/videos/category?id=${catId}`);
                if (!res.ok) throw new Error("Data cannot be retrieved from the server");

                const videos = await res.json();
                grid.innerHTML = ''; 
                
                if(videos.length === 0) {
                    grid.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#888;">No Video for this Category</p>';
                    return;
                }

                videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => playVideo(video.file_id, video.id, video.worker_id);
                    card.innerHTML = `
                        <video src="${video.preview_url || ''}" autoplay loop muted playsinline></video>
                        <div class="title">${video.title}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = ''; 
                showErrorPopup(error.message); 
            }
        }
    // Play Video 
        function playVideo(fileId, videoId, workerId) {
    const modal = document.getElementById('playerModal');
    const video = document.getElementById('mainPlayer');
    
    // 🔴 Worker ID အလိုက် Link ကို ရွေးမယ်
    let streamBaseUrl = "";
    if (workerId == 2) {
        streamBaseUrl = "https://myapp.8tetaun9.workers.dev"; // Worker 2
    } else {
        streamBaseUrl = "https://myhubapp.dathalay1.workers.dev"; // Worker 1 (Default)
    }

    const streamUrl = `${streamBaseUrl}/stream?file_id=${encodeURIComponent(fileId)}`;

    modal.style.display = 'flex';

    if (!player) {
        player = new Plyr(video, {
            controls: ['play-large', 'rewind', 'play','fast-forward', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
            settings: ['captions', 'quality', 'speed', 'loop'],
            fullscreen: { enabled: true, fallback: true, iosNative: true }
        });
    }

    video.src = streamUrl;
    player.play().catch(e => console.log("Autoplay blocked", e));

    // Views တိုးစေမယ့် API (ဒါက Main Worker ကိုပဲ ခေါ်မယ်)
    fetch(`https://myhubapp.dathalay1.workers.dev/api/videos/view`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: videoId })
    }).catch(e => console.log("View count error", e));
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            modal.style.display = 'none';
            
            if (player) { 
                player.pause(); 
            }
        }

        loadVideos();
    </script>
</body>
</html>
