<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Videos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        /* VIP Page */
        .logo { color: gold !important; }
        .sidebar a.active-vip { color: gold !important; border-left-color: gold !important; }
    </style>
</head>
<body>

    <!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-area">
            <div class="profile-img" id="sidebarProfileImg" style="overflow: hidden;">
                <img src="https://i.ibb.co/dJH3B61v/59693-Photoroom.png" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
            </div>
            <div class="logo-text">
                <h2>My Hub</h2>
                <p>Play  with  me</p>
            </div>
        </div>
        <button class="close-sidebar-btn" onclick="toggleMenu()">✕</button>
    </div>
        
        <div class="sidebar-links">
    <a href="index.html">
        <span class="icon"><i data-feather="home"></i></span> Home
    </a>
    <a href="popular.html">
        <span class="icon"><i data-feather="trending-up"></i></span> Popular
    </a>
    <a href="models.html">
        <span class="icon"><i data-feather="users"></i></span> Models
    </a>
    <a href="categories.html">
        <span class="icon"><i data-feather="film"></i></span> Categories
    </a>
    <a href="search.html">
        <span class="icon"><i data-feather="search"></i></span> Search
    </a>
    <a href="vip.html" style="color: gold;" class="active">
        <span class="icon"><i data-feather="award"></i></span> VIP Videos
    </a>

    <div style="border-top: 1px solid #333; margin: 15px 10px;"></div>

    <a href="login.html" id="navLogin" style="color: #00d2ff;">
        <span class="icon"><i data-feather="key"></i></span> Login
    </a>
    <a href="account.html" id="navAccount" style="display: none; color: #00ff88;">
        <span class="icon"><i data-feather="settings"></i></span> My Account
    </a>
</div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Navbar -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h1 class="logo">VIP Videos</h1>
    </div>

    <!-- Content -->
    <div class="container">
        <div class="grid video-grid" id="videoGrid">
            <div class="loading-wrapper" style="grid-column: span 2;">
                <div class="spinner"></div>
                <p>Please Wait . . .</p>
            </div>
        </div>
    </div>

    <!-- Custom Error Popup -->
    <div id="customPopup">
        <div class="popup-content">
            <div class="popup-icon">⚠️</div>
            <div class="popup-title">Error</div>
            <div class="popup-message" id="popupMsg">Cannot connect to the server</div>
            <button class="popup-btn" onclick="retryLoad()">Retry</button>
        </div>
    </div>

    <!-- Custom VIP Popup -->
    <div id="vipPopup">
        <div class="popup-content">
            <div class="popup-icon">🔒</div>
            <div class="popup-title">VIP Videos</div>
            <div class="popup-message">You need to login to watch this video.</div>
            <button class="popup-btn" onclick="goToLogin()" style="margin-bottom: 10px;">Go to Login</button>
            <button onclick="closeVipPopup()" style="background:none; border:none; color:#9ca3af; width:100%; cursor:pointer; font-size:14px; padding:10px;">Cancel</button>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal">
        <button id="closeBtn" onclick="closePlayer()">✕</button>
        <video id="mainPlayer" controls playsinline></video>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev"; 
        let player; 
        
        // 🔴 Sidebar 
        if (localStorage.getItem('username')) {
            document.getElementById('navLogin').style.display = 'none';
            document.getElementById('navAccount').style.display = 'flex';
            
            const savedPic = localStorage.getItem('profile_pic');
            if (savedPic) {
                document.getElementById('sidebarProfileImg').innerHTML = `<img src="${savedPic}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
            }
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function showErrorPopup(message) {
            document.getElementById('popupMsg').innerText = message;
            document.getElementById('customPopup').style.display = 'flex';
        }

        function retryLoad() {
            document.getElementById('customPopup').style.display = 'none';
            document.getElementById('videoGrid').innerHTML = `
                <div class="loading-wrapper" style="grid-column: span 2;">
                    <div class="spinner"></div>
                    <p>Checking . . .</p>
                </div>`;
            loadVipVideos();
        }

        function closeVipPopup() {
            document.getElementById('vipPopup').style.display = 'none';
            window.location.href = 'index.html'; 
        }

        function goToLogin() {
            window.location.href = 'login.html';
        }

        async function loadVipVideos() {
            if (!localStorage.getItem('username')) {
                document.getElementById('vipPopup').style.display = 'flex';
                return;
            }

            const grid = document.getElementById('videoGrid');
            
            try {
                const res = await fetch(`${API_URL}/api/videos/vip`);
                if (!res.ok) throw new Error("Server error");

                const videos = await res.json();
                grid.innerHTML = ''; 
                
                if(videos.length === 0) {
                    grid.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#888;">No VIP Videos</p>';
                    return;
                }

                videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'card video-card';
            
                    card.onclick = () => playVideo(video.file_id, video.id);
                    card.innerHTML = `
                        <video src="${video.preview_url || ''}" autoplay loop muted playsinline></video>
                        <div class="title" style="color: gold;">${video.title} 👑</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = ''; 
                showErrorPopup(error.message); 
            }
        }

        // 🔴 Play Videos 
        function playVideo(fileId, videoId) {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('mainPlayer');
            const streamUrl = `${API_URL}/stream?file_id=${encodeURIComponent(fileId)}`;
            
            modal.style.display = 'flex';

            if (!player) {
                player = new Plyr(video, {
                    controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
                });
            }

            video.src = streamUrl;
            player.play().catch(e => console.log("Autoplay blocked", e));

            // 🔴 Views
            fetch(`${API_URL}/api/videos/view`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: videoId })
            }).catch(e => console.log("View count error", e));
        }
        
        // 

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            modal.style.display = 'none';
            
            if (player) { 
                player.pause(); 
            }
        }

        loadVipVideos();
    </script>
    <script src="https://unpkg.com/feather-icons"></script>
    
    <script>
        feather.replace();
    </script>
</body>
</html>
