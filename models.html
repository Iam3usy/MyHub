<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-area">
            <div class="profile-img" id="sidebarProfileImg" style="overflow: hidden;">
                <img src="https://i.ibb.co/dJH3B61v/59693-Photoroom.png" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
            </div>
            <div class="logo-text">
                <h2>My Hub</h2>
                <p>Play  with  me</p>
            </div>
        </div>
        <button class="close-sidebar-btn" onclick="toggleMenu()">✕</button>
    </div>
    
<div class="sidebar-links">
    <a href="index.html">
        <span class="icon"><i data-feather="home"></i></span> Home
    </a>
    <a href="popular.html">
        <span class="icon"><i data-feather="trending-up"></i></span> Popular
    </a>
    <a href="models.html" class="active">
        <span class="icon"><i data-feather="users"></i></span> Models
    </a>
    <a href="categories.html">
        <span class="icon"><i data-feather="film"></i></span> Categories
    </a>
    <a href="search.html">
        <span class="icon"><i data-feather="search"></i></span> Search
    </a>
    <a href="vip.html" style="color: gold;">
        <span class="icon"><i data-feather="award"></i></span> VIP Videos
    </a>

<div style="border-top: 1px solid #333; margin: 15px 10px;"></div>

    <a href="login.html" id="navLogin" style="color: #00d2ff;">
        <span class="icon"><i data-feather="key"></i></span> Login
    </a>
    <a href="account.html" id="navAccount" style="display: none; color: #00ff88;">
        <span class="icon"><i data-feather="settings"></i></span> My Account
    </a>
</div>
</div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Navbar -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h1 class="logo">Models</h1>
    </div>

    <!-- Content -->
    <div class="container">
        <div class="grid" id="modelGrid">
            <div class="loading-wrapper" style="grid-column: span 3;">
                <div class="spinner"></div>
                <p>Please Wait . . .</p>
            </div>
        </div>
    </div>

    <!-- Custom Error Popup -->
    <div id="customPopup">
        <div class="popup-content">
            <div class="popup-icon">⚠️</div>
            <div class="popup-title">Error</div>
            <div class="popup-message" id="popupMsg">Cannot connect to the server</div>
            <button class="popup-btn" onclick="retryLoad()">Retry</button>
        </div>
    </div>

    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev"; 

        // Sidebar Login/Account 
        if (localStorage.getItem('username')) {
            document.getElementById('navLogin').style.display = 'none';
            document.getElementById('navAccount').style.display = 'flex'; 
            
            }
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function showErrorPopup(message) {
            document.getElementById('popupMsg').innerText = message;
            document.getElementById('customPopup').style.display = 'flex';
        }

        function retryLoad() {
            document.getElementById('customPopup').style.display = 'none';
            document.getElementById('modelGrid').innerHTML = `
                <div class="loading-wrapper" style="grid-column: span 3;">
                    <div class="spinner"></div>
                    <p>Please Wait . . .</p>
                </div>`;
            loadModels();
        }

        async function loadModels() {
            const grid = document.getElementById('modelGrid');
            
            try {
                const res = await fetch(`${API_URL}/api/models`);
                if (!res.ok) throw new Error("Server Error");

                const models = await res.json();
                grid.innerHTML = ''; 

                if(models.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column: span 3; color:#888;">Unavailable for this Model</p>';
                    return;
                }

                models.forEach(m => {
                    const a = document.createElement('a');
                    a.className = 'card model-card'; 
                    a.href = `model.html?id=${m.id}&name=${encodeURIComponent(m.name)}`;
                    
                    // 🔴 ပုံကို div ထဲမှာ ထည့်ပြီး အောက်ထောင့်မှာ 🎥 badge လေး ထည့်ထားပါတယ်
                    a.innerHTML = `
                        <div style="position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden;">
                            <img src="${m.image || 'https://via.placeholder.com/150'}" alt="${m.name}" style="width: 100%; height: 100%; object-fit: cover;">
                            <span class="video-count-badge">🎥 ${m.video_count || 0}</span>
                        </div>
                        <p class="title" style="padding: 8px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; text-align: left;">${m.name}</p>
                    `;
                    grid.appendChild(a);
                });
            } catch (error) {
                grid.innerHTML = ''; 
                showErrorPopup(error.message); 
            }
        }

        loadModels();
    </script>
    <script src="https://unpkg.com/feather-icons"></script>
    
    <script>
        feather.replace();
    </script>
</body>
</html>
