<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Models</title>
    
    <!-- Google Font & CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <!-- 🔴 Profile -->
            <div class="profile-img" id="sidebarProfileImg" style="overflow: hidden;">👤</div>
            <h2>MyVideo</h2>
            <p>Premium Streaming</p>
        </div>

        <div class="sidebar-links">
            <a href="index.html"><span class="icon">🏠</span> Home </a>
            <a href="models.html" class="active"><span class="icon">👤</span> Models</a>
            <a href="categories.html"><span class="icon">🎬</span> Categories</a>
            <!-- 🔴 Popular Link ထည့်ထားတယ် -->
            <a href="popular.html" style="color: #00ff88;"><span class="icon">🔥</span> Popular</a>
            <a href="vip.html" style="color: gold;"><span class="icon">👑</span> VIP Videos</a>
            
            <div style="border-top: 1px solid #333; margin: 15px 10px;"></div>
            
            <a href="login.html" id="navLogin" style="color: #00d2ff;"><span class="icon">🔑</span> Login</a>
            <a href="account.html" id="navAccount" style="display: none; color: #00ff88;"><span class="icon">⚙️</span> My Account</a>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Navbar -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h1 class="logo">Models</h1>
    </div>

    <!-- Content -->
    <div class="container">
        <!-- modelGrid -->
        <div class="grid" id="modelGrid">
            <!-- Loading Spinner Center -->
            <div class="loading-wrapper" style="grid-column: span 3;">
                <div class="spinner"></div>
                <p>Please Wait . . .</p>
            </div>
        </div>
    </div>

    <!-- Custom Error Popup -->
    <div id="customPopup">
        <div class="popup-content">
            <div class="popup-icon">⚠️</div>
            <div class="popup-title">Error</div>
            <div class="popup-message" id="popupMsg">Cannot connect to the server</div>
            <button class="popup-btn" onclick="retryLoad()">Retry</button>
        </div>
    </div>

    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev"; 

        // 🔴 Sidebar Login/Account 
        if (localStorage.getItem('username')) {
            document.getElementById('navLogin').style.display = 'none';
            document.getElementById('navAccount').style.display = 'flex'; 
            
            // Save Piv
            const savedPic = localStorage.getItem('profile_pic');
            if (savedPic) {
                document.getElementById('sidebarProfileImg').innerHTML = `<img src="${savedPic}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
            }
        }

        // Sidebar
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        // Error Popup
        function showErrorPopup(message) {
            document.getElementById('popupMsg').innerText = message;
            document.getElementById('customPopup').style.display = 'flex';
        }

        // Retry
        function retryLoad() {
            document.getElementById('customPopup').style.display = 'none';
            document.getElementById('modelGrid').innerHTML = `
                <div class="loading-wrapper" style="grid-column: span 3;">
                    <div class="spinner"></div>
                    <p>Please Wait . . .</p>
                </div>`;
            loadModels();
        }

        // Models Load
        async function loadModels() {
            const grid = document.getElementById('modelGrid');
            
            try {
                const res = await fetch(`${API_URL}/api/models`);
                if (!res.ok) throw new Error("Server Error");

                const models = await res.json();
                grid.innerHTML = ''; 

                if(models.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column: span 3; color:#888;">Unavailable for this Model</p>';
                    return;
                }

                models.forEach(m => {
                    const a = document.createElement('a');
                    a.className = 'card model-card'; 
                    a.href = `model.html?id=${m.id}&name=${encodeURIComponent(m.name)}`;
                    
                    a.innerHTML = `
                        <img src="${m.image || 'https://via.placeholder.com/150'}" alt="${m.name}">
                        <p class="title" style="display: flex; justify-content: space-between; align-items: center; padding: 8px; margin: 0;">
                            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${m.name}</span>
                            <span style="color: #00e676; font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 2px;">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                ${m.video_count || 0}
                            </span>
                        </p>
                    `;
                    grid.appendChild(a);
                });
            } catch (error) {
                grid.innerHTML = ''; 
                showErrorPopup(error.message); 
            }
        }

        loadModels();
    </script>
</body>
</html>
