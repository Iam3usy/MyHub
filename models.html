<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Models</title>
    
    <!-- Google Font နဲ့ CSS ချိတ်ဆက်ခြင်း -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="profile-img">👤</div>
            <h2>MyVideo</h2>
            <p>Premium Streaming</p>
        </div>

        <div class="sidebar-links">
            <a href="index.html"><span class="icon">🏠</span> Home </a>
            <a href="models.html" class="active"><span class="icon">👤</span> Models</a>
            <a href="categories.html"><span class="icon">🎬</span> Categories</a>
            <a href="vip.html" style="color: gold;"><span class="icon">👑</span> VIP Videos</a>
            
            <div style="border-top: 1px solid #333; margin: 15px 10px;"></div>
            
            <a href="login.html" id="navLogin" style="color: #00d2ff;"><span class="icon">🔑</span> Login</a>
            <a href="account.html" id="navAccount" style="display: none; color: #00ff88;"><span class="icon">⚙️</span> My Account</a>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Navbar -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h1 class="logo">Models</h1>
    </div>

    <!-- Content -->
    <div class="container">
        <!-- 🔴 ID ကို modelGrid လို့ ပြင်ထားပါတယ် -->
        <div class="grid" id="modelGrid">
            <!-- Loading Spinner Center -->
            <div class="loading-wrapper" style="grid-column: span 3;">
                <div class="spinner"></div>
                <p>Please Wait...</p>
            </div>
        </div>
    </div>

    <!-- Custom Error Popup -->
    <div id="customPopup">
        <div class="popup-content">
            <div class="popup-icon">⚠️</div>
            <div class="popup-title">Error</div>
            <div class="popup-message" id="popupMsg">Cannot connect to the server</div>
            <button class="popup-btn" onclick="retryLoad()">Retry</button>
        </div>
    </div>

    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev"; // မင်း Worker Link

        // Sidebar မှာ Login/Account ပြဖို့ စစ်ဆေးခြင်း
        if (localStorage.getItem('username')) {
            document.getElementById('navLogin').style.display = 'none';
            document.getElementById('navAccount').style.display = 'flex'; 
        }

        // Sidebar အဖွင့်အပိတ်
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        // Error Popup ပြမယ့် Function
        function showErrorPopup(message) {
            document.getElementById('popupMsg').innerText = message;
            document.getElementById('customPopup').style.display = 'flex';
        }

        // Retry နှိပ်ရင် လုပ်မယ့်အလုပ်
        function retryLoad() {
            document.getElementById('customPopup').style.display = 'none';
            document.getElementById('modelGrid').innerHTML = `
                <div class="loading-wrapper" style="grid-column: span 3;">
                    <div class="spinner"></div>
                    <p>ခဏစောင့်ပါ...</p>
                </div>`;
            loadModels();
        }

        // မော်ဒယ်များ ဆွဲထုတ်ခြင်း
        async function loadModels() {
            const grid = document.getElementById('modelGrid');
            
            try {
                const res = await fetch(`${API_URL}/api/models`);
                if (!res.ok) throw new Error("Server Error");

                const models = await res.json();
                grid.innerHTML = ''; // Loading ကို ဖျက်မယ်

                if(models.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column: span 3; color:#888;">မော်ဒယ် မရှိသေးပါ။</p>';
                    return;
                }

                models.forEach(m => {
                    const a = document.createElement('a');
                    a.className = 'card';
                    a.href = `model.html?id=${m.id}&name=${encodeURIComponent(m.name)}`;
                    a.innerHTML = `
                        <img src="${m.image || 'https://via.placeholder.com/150'}" alt="${m.name}">
                        <p>${m.name}</p>
                    `;
                    grid.appendChild(a);
                });
            } catch (error) {
                grid.innerHTML = ''; 
                showErrorPopup(error.message); 
            }
        }

        // စာမျက်နှာ စတင်တာနဲ့ အလုပ်လုပ်မယ်
        loadModels();
    </script>
</body>
</html>
