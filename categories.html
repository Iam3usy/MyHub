<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Categories</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <!-- 🔴 Profile -->
            <div class="profile-img" id="sidebarProfileImg" style="overflow: hidden;">👤</div>
            <h2>MyVideo</h2>
            <p>Premium Streaming</p>
        </div>

        <div class="sidebar-links">
            <a href="index.html"><span class="icon">🏠</span> Home </a>
            <a href="models.html"><span class="icon">👤</span> Models</a>
            <a href="categories.html" class="active"><span class="icon">🎬</span> Categories</a>
            <a href="popular.html" style="color: #00ff88;"><span class="icon">🔥</span> Popular</a>
            <a href="vip.html" style="color: gold;"><span class="icon">👑</span> VIP Videos</a>
            
            <div style="border-top: 1px solid #333; margin: 15px 10px;"></div>
            
            <a href="login.html" id="navLogin" style="color: #00d2ff;"><span class="icon">🔑</span> Login</a>
            <a href="account.html" id="navAccount" style="display: none; color: #00ff88;"><span class="icon">⚙️</span> My Account</a>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Navbar -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h1 class="logo">Categories</h1>
    </div>

    <!-- Content -->
    <div class="container">

        <div class="grid" id="categoryGrid">
            <!-- Loading Spinner Center -->
            <div class="loading-wrapper" style="grid-column: span 3;">
                <div class="spinner"></div>
                <p>Please Wait . . .</p>
            </div>
        </div>
    </div>

    <!-- Custom Error Popup -->
    <div id="customPopup">
        <div class="popup-content">
            <div class="popup-icon">⚠️</div>
            <div class="popup-title">Error</div>
            <div class="popup-message" id="popupMsg">Cannot connect to the server</div>
            <button class="popup-btn" onclick="retryLoad()">Retry</button>
        </div>
    </div>

    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev";

        // 🔴 Sidebar
        if (localStorage.getItem('username')) {
            document.getElementById('navLogin').style.display = 'none';
            document.getElementById('navAccount').style.display = 'flex'; 
            
            // Save Pic
            const savedPic = localStorage.getItem('profile_pic');
            if (savedPic) {
                document.getElementById('sidebarProfileImg').innerHTML = `<img src="${savedPic}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
            }
        }

        // Sidebar 
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        // Error Popup 
        function showErrorPopup(message) {
            document.getElementById('popupMsg').innerText = message;
            document.getElementById('customPopup').style.display = 'flex';
        }

        // Retry
        function retryLoad() {
            document.getElementById('customPopup').style.display = 'none';
            document.getElementById('categoryGrid').innerHTML = `
                <div class="loading-wrapper" style="grid-column: span 3;">
                    <div class="spinner"></div>
                    <p>Please Wait . . .</p>
                </div>`;
            loadCategories();
        }

        // Category
        async function loadCategories() {
            const grid = document.getElementById('categoryGrid');
            
            try {
                const res = await fetch(`${API_URL}/api/categories`);
                if (!res.ok) throw new Error("Server Error");

                const cats = await res.json();
                grid.innerHTML = ''; 

                if(cats.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column: span 3; color:#888;">No Category for this content</p>';
                    return;
                }

                cats.forEach(cat => {
                    const a = document.createElement('a');
                    a.className = 'card model-card';
                    a.href = `category.html?id=${cat.id}&name=${encodeURIComponent(cat.name)}`;
                    
                    // 🔴 ပုံကို div ထဲမှာ ထည့်ပြီး အောက်ထောင့်မှာ 🎥 badge လေး ထည့်ထားပါတယ်
                    a.innerHTML = `
                        <div style="position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden;">
                            <img src="${cat.image || 'https://via.placeholder.com/150'}" alt="${cat.name}" style="width: 100%; height: 100%; object-fit: cover;">
                            <span class="video-count-badge">🎥 ${cat.video_count || 0}</span>
                        </div>
                        <p class="title" style="padding: 8px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; text-align: left;">${cat.name}</p>
                    `;
                    grid.appendChild(a);
                });
            } catch (error) {
                grid.innerHTML = ''; 
                showErrorPopup(error.message); 
            }
        }

        loadCategories();
    </script>
    <script src="https://unpkg.com/feather-icons"></script>
    
    <script>
        feather.replace();
    </script>
</body>
</html>
