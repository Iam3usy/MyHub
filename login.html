<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    
    <!-- Google Font နဲ့ CSS ချိတ်ဆက်ခြင်း -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Login Page အတွက် သီးသန့် နေရာချထားမှု */
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            padding: 0;
        }
        .login-container {
            width: 90%;
            max-width: 400px;
        }
        .error { 
            color: var(--primary); 
            font-size: 14px; 
            text-align: center; 
            margin-top: 15px; 
            font-weight: bold;
        }
        /* Back to Home Link */
        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .back-home:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="form-box">
            <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">Login</h2>
            
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="key_code" placeholder="VIP Key">
            
            <button onclick="login()" id="loginBtn">ဝင်ရောက်မည်</button>
            
            <p id="errorMsg" class="error"></p>

            <!-- Back to Home Link -->
            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </div>

    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev"; // မင်း Worker Link

        // Device ID ထုတ်ယူခြင်း (Browser တစ်ခုကို တစ်ခုတည်းသတ်မှတ်ဖို့)
        function getDeviceId() {
            let devId = localStorage.getItem('device_id');
            if (!devId) {
                devId = 'dev_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('device_id', devId);
            }
            return devId;
        }

        async function login() {
            const username = document.getElementById('username').value;
            const key_code = document.getElementById('key_code').value;
            const device_id = getDeviceId();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if(!username || !key_code) {
                errorMsg.innerText = "အချက်အလက်များ ပြည့်စုံအောင် ဖြည့်ပါ";
                return;
            }

            // ခလုတ်ကို Loading ပြမယ်
            btn.innerText = "စစ်ဆေးနေပါသည်...";
            btn.disabled = true;
            btn.style.opacity = "0.7";
            errorMsg.innerText = "";

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, key_code, device_id })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    // အောင်မြင်ရင် Browser မှာ သိမ်းမယ်
                    localStorage.setItem('username', data.user.username);
                    localStorage.setItem('expired_date', data.user.expired_date);
                    window.location.href = 'account.html'; // Account Page ကို ပို့မယ်
                } else {
                    errorMsg.innerText = data.error;
                    // မအောင်မြင်ရင် ခလုတ်ကို ပုံမှန်ပြန်ထားမယ်
                    btn.innerText = "ဝင်ရောက်မည်";
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }
            } catch (error) {
                errorMsg.innerText = "ဆာဗာ Error ဖြစ်နေပါတယ်";
                btn.innerText = "ဝင်ရောက်မည်";
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
