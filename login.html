<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 65px);
            padding: 20px;
        }
        .form-box { width: 100%; max-width: 400px; }
        .error { color: var(--primary); font-size: 14px; text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-area">
            <div class="profile-img" id="sidebarProfileImg" style="overflow: hidden;">
                <img src="https://i.ibb.co/dJH3B61v/59693-Photoroom.png" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
            </div>
            <div class="logo-text">
                <h2>My  Hub</h2>
                <p>Play  with  me</p>
            </div>
        </div>
        <button class="close-sidebar-btn" onclick="toggleMenu()">✕</button>
    </div>
    
    <div class="sidebar-links">
        <a href="index.html">
            <span class="icon"><i data-feather="home"></i></span> Home
        </a>
        <a href="popular.html">
            <span class="icon"><i data-feather="trending-up"></i></span> Popular
        </a>
        <a href="models.html">
            <span class="icon"><i data-feather="users"></i></span> Models
        </a>
        <a href="categories.html">
            <span class="icon"><i data-feather="film"></i></span> Categories
        </a>
        <a href="search.html">
            <span class="icon"><i data-feather="search"></i></span> Search
        </a>
        <a href="vip.html" style="color: gold;">
            <span class="icon"><i data-feather="award"></i></span> VIP Videos
        </a>
        
        <div style="border-top: 1px solid #333; margin: 15px 10px;"></div>
        
        <a href="login.html" id="navLogin" class="active" style="color: #00d2ff;">
            <span class="icon"><i data-feather="key"></i></span> Login
        </a>
        <a href="account.html" id="navAccount" style="display: none; color: #00ff88;">
            <span class="icon"><i data-feather="settings"></i></span> My Account
        </a>
    </div>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- Navbar -->
<div class="navbar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <h1 class="logo">Login</h1>
</div>

<!-- Content -->
<div class="login-container">
    <div class="form-box">
        <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">Login</h2>
        
        <input type="text" id="username" placeholder="Username" onkeypress="handleEnter(event)">
        
        <!-- 🔴 VIP Key အတွက် မျက်လုံးလေး ထည့်ထားပါတယ် -->
        <div style="position: relative; width: 100%;">
            <input type="password" id="key_code" placeholder="VIP Key" onkeypress="handleEnter(event)" style="margin-bottom: 0; padding-right: 40px; width: 100%;">
            <span onclick="togglePassword()" style="position: absolute; right: 15px; top: 0; bottom: 0; display: flex; align-items: center; cursor: pointer; color: #888;">
                 <i data-feather="eye" id="eyeIcon"></i>
            </span>
        </div>
        <div style="height: 15px;"></div>
        
        <button onclick="login()" id="loginBtn">Login</button>
        
        <p id="errorMsg" class="error"></p>
    </div>
</div>

<!-- Feather Icons -->
<script src="https://unpkg.com/feather-icons"></script>

<script>
    feather.replace();
    
    const API_URL = "https://myhubapp.dathalay1.workers.dev";

    if (localStorage.getItem('username')) {
        document.getElementById('navLogin').style.display = 'none';
        document.getElementById('navAccount').style.display = 'flex'; 
       }
    }
    
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }

    // 🔴 မျက်လုံးလေး နှိပ်ရင် Key ကို ဖျောက်/ပြ လုပ်ပေးမယ့် Function
    function togglePassword() {
        const keyInput = document.getElementById('key_code');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (keyInput.type === "password") {
            keyInput.type = "text";
            eyeIcon.setAttribute("data-feather", "eye-off");
        } else {
            keyInput.type = "password";
            eyeIcon.setAttribute("data-feather", "eye");
        }
        feather.replace();
    }

    function handleEnter(e) {
        if (e.key === 'Enter') {
            login();
        }
    }
    
    function getDeviceId() {
        let devId = localStorage.getItem('device_id');
        if (!devId) {
            devId = 'dev_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('device_id', devId);
        }
        return devId;
    }
    
    async function login() {
        const username = document.getElementById('username').value;
        const key_code = document.getElementById('key_code').value;
        const device_id = getDeviceId();
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        
        if (!username || !key_code) {
            errorMsg.innerText = "Please fill in all fields";
            return;
        }
        
        btn.innerText = "Checking...";
        btn.disabled = true;
        btn.style.opacity = "0.7";
        errorMsg.innerText = "";
        
        try {
            const res = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, key_code, device_id })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem('username', data.user.username);
                localStorage.setItem('expired_date', data.user.expired_date);
                
                // 🔴 Key ကို သိမ်းထားတဲ့ ကုဒ် (အကောင့်ထဲမှာ ပြဖို့)
                localStorage.setItem('key_code', key_code);
                
                if (!localStorage.getItem('profile_pic') && data.user.profile_pic) {
                    localStorage.setItem('profile_pic', data.user.profile_pic);
                }
                
                window.location.href = 'account.html';
            } else {
                errorMsg.innerText = data.error;
                btn.innerText = "Login";
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        } catch (error) {
            errorMsg.innerText = "Server error. Please try again.";
            btn.innerText = "Login";
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    }
</script>
</body>
</html>
