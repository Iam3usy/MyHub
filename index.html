<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - Premium Videos</title>
    
    <!-- Google Font နဲ့ CSS ချိတ်ဆက်ခြင်း -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Plyr Video Player CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="profile-img">👤</div>
        <h2>MyVideo</h2>
        <p>Premium Streaming</p>
    </div>
    
    <div class="sidebar-links">
        <a href="index.html" class="active"><span class="icon">🏠</span> Home</a>
        <a href="categories.html"><span class="icon">🎬</span> Categories</a>
        <a href="models.html"><span class="icon">👤</span> Models</a>
        <a href="vip.html" style="color: gold;"><span class="icon">👑</span> VIP Videos</a>
        
        <div style="border-top: 1px solid #333; margin: 15px 10px;"></div>
        
        <a href="login.html" id="navLogin" style="color: #00d2ff;"><span class="icon">🔑</span> Login</a>
        <a href="account.html" id="navAccount" style="display: none; color: #00ff88;"><span class="icon">⚙️</span> My Account</a>
    </div>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Navbar -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h1 class="logo">My<span>Video</span></h1>
    </div>

    <!-- Content -->
    <div class="container">
        <div class="grid video-grid" id="videoGrid">
            <!-- Loading Spinner Center -->
            <div class="loading-wrapper" style="grid-column: span 3;">
                <div class="spinner"></div>
                <p>Please Wait...</p>
            </div>
        </div>
    </div>
    
    <!-- Custom Error Popup -->
    <div id="customPopup">
        <div class="popup-content">
            <div class="popup-icon">⚠️</div>
            <div class="popup-title">Error</div>
            <div class="popup-message" id="popupMsg">Cannot connect to the server</div>
            <button class="popup-btn" onclick="retryLoad()">Retry</button>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="playerModal">
        <button id="closeBtn" onclick="closePlayer()">✕</button>
        <video id="mainPlayer" controls playsinline></video>
    </div>

    <!-- Plyr Video Player JS -->
     <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
     <script>
    const API_URL = "https://myhubapp.dathalay1.workers.dev"; 
    let player; // Plyr အတွက် သတ်မှတ်မယ်

    // Sidebar မှာ Login/Account ပြဖို့ စစ်ဆေးခြင်း
    if (localStorage.getItem('username')) {
        document.getElementById('navLogin').style.display = 'none';
        document.getElementById('navAccount').style.display = 'flex'; 
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }

    function showErrorPopup(message) {
        document.getElementById('popupMsg').innerText = message;
        document.getElementById('customPopup').style.display = 'flex';
    }

    function retryLoad() {
        document.getElementById('customPopup').style.display = 'none';
        document.getElementById('videoGrid').innerHTML = `
            <div class="loading-wrapper" style="grid-column: span 2;">
                <div class="spinner"></div>
                <p>ခဏစောင့်ပါ...</p>
            </div>`;
        loadVideos();
    }

    async function loadVideos() {
        const grid = document.getElementById('videoGrid');
        try {
            const res = await fetch(`${API_URL}/api/videos`);
            if (!res.ok) throw new Error("Server Error");

            const videos = await res.json();
            grid.innerHTML = ''; 

            if(videos.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: span 2; color:#888; margin-top: 20px;">ဇာတ်ကား မရှိသေးပါ။</p>';
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'card video-card';
                card.onclick = () => playVideo(video.file_id);
                card.innerHTML = `
                    <video src="${video.preview_url || ''}" autoplay loop muted playsinline></video>
                    <div class="title">${video.title}</div>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            grid.innerHTML = ''; 
            showErrorPopup(error.message); 
        }
    }

    function playVideo(fileId) {
        const modal = document.getElementById('playerModal');
        const video = document.getElementById('mainPlayer');
        const streamUrl = `${API_URL}/stream?file_id=${fileId}`;
        
        modal.style.display = 'flex';

        // အရင် Player ရှိရင် ဖျက်မယ်
        if (player) {
            player.destroy();
        }

        // Plyr ကို အသုံးပြုပြီး Player ဖန်တီးမယ်
        player = new Plyr(video, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
            settings: ['quality', 'speed'],
            speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
        });

        // Hls.js နဲ့ တွဲသုံးမယ်
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                player.play(); 
            });
            window.currentHls = hls;
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() { player.play(); });
        }
    }

    function closePlayer() {
        const modal = document.getElementById('playerModal');
        const video = document.getElementById('mainPlayer');
        modal.style.display = 'none';
        video.pause();
        video.src = '';
        if(window.currentHls) window.currentHls.destroy();
        if (player) { player.destroy(); player = null; }
    }

    loadVideos();
</script>
</body>
</html>
