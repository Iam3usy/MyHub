<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Hub Videos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-area">
            <div class="profile-img" id="sidebarProfileImg" style="overflow: hidden;">
                <img src="https://i.ibb.co/dJH3B61v/59693-Photoroom.png" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
            </div>
            <div class="logo-text">
                <h2>My Hub</h2>
                <p>Play with me</p>
            </div>
        </div>
        <button class="close-sidebar-btn" onclick="toggleMenu()">✕</button>
    </div>
    
    <div class="sidebar-links">
        <a href="index.html" class="active">
            <span class="icon"><i data-feather="home"></i></span> Home
        </a>
        <a href="popular.html">
            <span class="icon"><i data-feather="trending-up"></i></span> Popular
        </a>
        <a href="models.html">
            <span class="icon"><i data-feather="users"></i></span> Models
        </a>
        <a href="categories.html">
            <span class="icon"><i data-feather="film"></i></span> Categories
        </a>
        <a href="search.html">
            <span class="icon"><i data-feather="search"></i></span> Search
        </a>
        <a href="vip.html" style="color: gold;">
            <span class="icon"><i data-feather="award"></i></span> VIP Videos
        </a>

        <div style="border-top: 1px solid #333; margin: 15px 10px;"></div>

        <a href="login.html" id="navLogin" style="color: #00d2ff;">
            <span class="icon"><i data-feather="key"></i></span> Login
        </a>
        <a href="account.html" id="navAccount" style="display: none; color: #00ff88;">
            <span class="icon"><i data-feather="settings"></i></span> My Account
        </a>
    </div>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- Navbar -->
<div class="navbar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <h1 class="logo">My<span>Video</span></h1>
</div>

<!-- Content -->
<div class="container">
    <div class="grid video-grid" id="videoGrid">
        <div class="loading-wrapper" style="grid-column: span 3;">
            <div class="spinner"></div>
            <p>Please Wait . . .</p>
        </div>
    </div>
</div>

<!-- Custom Error Popup -->
<div id="customPopup">
    <div class="popup-content">
        <div class="popup-icon">⚠️</div>
        <div class="popup-title">Error</div>
        <div class="popup-message" id="popupMsg">Cannot connect to the server</div>
        <button class="popup-btn" onclick="retryLoad()">Retry</button>
    </div>
</div>

<!-- Player Modal -->
<div id="playerModal">
    <button id="closeBtn" onclick="closePlayer()">✕</button>
    <video id="mainPlayer" controls playsinline></video>
</div>

<!-- Plyr JS & Feather Icons -->
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://unpkg.com/feather-icons"></script>

<script>
    // Feather Icons အလုပ်လုပ်အောင်
    feather.replace();

    const API_URL = "https://myhubapp.dathalay1.workers.dev"; 
    let player; 

    if (localStorage.getItem('username')) {
        document.getElementById('navLogin').style.display = 'none';
        document.getElementById('navAccount').style.display = 'flex'; 
        
        const savedPic = localStorage.getItem('profile_pic');
        if (savedPic) {
            document.getElementById('sidebarProfileImg').innerHTML = `<img src="${savedPic}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
        }
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }

    function showErrorPopup(message) {
        document.getElementById('popupMsg').innerText = message;
        document.getElementById('customPopup').style.display = 'flex';
    }

    function retryLoad() {
        document.getElementById('customPopup').style.display = 'none';
        document.getElementById('videoGrid').innerHTML = `
            <div class="loading-wrapper" style="grid-column: span 2;">
                <div class="spinner"></div>
                <p>Please Wait . . .</p>
            </div>`;
        loadVideos();
    }

    async function loadVideos() {
        const grid = document.getElementById('videoGrid');
        try {
            const res = await fetch(`${API_URL}/api/videos`);
            if (!res.ok) throw new Error("Server Error");

            const videos = await res.json();
            grid.innerHTML = ''; 

            if(videos.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: span 2; color:#888; margin-top: 20px;">ဇာတ်ကား မရှိသေးပါ။</p>';
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'card video-card';
                
                card.onclick = () => playVideo(video.file_id, video.id, video.worker_id);
                card.innerHTML = `
                    <video src="${video.preview_url || ''}" autoplay loop muted playsinline></video>
                    <div class="title">${video.title}</div>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            grid.innerHTML = ''; 
            showErrorPopup(error.message); 
        }
    }

    function playVideo(fileId, videoId, workerId) {
        const modal = document.getElementById('playerModal');
        const video = document.getElementById('mainPlayer');
        
        let streamBaseUrl = "";
        if (workerId == 2) {
            streamBaseUrl = "https://myapp.8tetaun9.workers.dev";
        } else {
            streamBaseUrl = "https://myhubapp.dathalay1.workers.dev";
        }

        const streamUrl = `${streamBaseUrl}/stream?file_id=${encodeURIComponent(fileId)}`;

        modal.style.display = 'flex';

        if (!player) {
            player = new Plyr(video, {
                controls: ['play-large', 'rewind', 'play','fast-forward', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                settings: ['captions', 'quality', 'speed', 'loop'],
                fullscreen: { enabled: true, fallback: true, iosNative: true }
            });
        }

        video.src = streamUrl;
        player.play().catch(e => console.log("Autoplay blocked", e));

        fetch(`https://myhubapp.dathalay1.workers.dev/api/videos/view`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: videoId })
        }).catch(e => console.log("View count error", e));
    }

    function closePlayer() {
        const modal = document.getElementById('playerModal');
        modal.style.display = 'none';
        
        if (player) {
            player.pause(); 
        }
    }

    loadVideos();
</script>
</body>
</html>
