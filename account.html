<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Account Page*/
        .account-container { padding: 20px; text-align: center; }
        
        .profile-img { 
            width: 100px; height: 100px; border-radius: 50%; 
            background: var(--nav-bg); margin: 0 auto 20px; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 45px; border: 3px solid var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .info-box { 
            background: var(--nav-bg); padding: 20px; border-radius: 15px; 
            margin-bottom: 20px; text-align: left; 
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .info-box p { 
            margin: 0 0 12px 0; font-size: 16px; color: var(--text-muted); 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px;
        }
        .info-box p:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        .info-box span { color: var(--text-main); font-weight: bold; }

        .renew-box { 
            background: var(--nav-bg); padding: 20px; border-radius: 15px; 
            margin-bottom: 20px; border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .renew-box h3 { color: var(--primary); margin-top: 0; margin-bottom: 10px; text-align: left; }
        .renew-box p { font-size: 14px; color: var(--text-muted); text-align: left; margin-bottom: 15px; }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        .btn { 
            flex: 1; padding: 12px; border-radius: 10px; text-decoration: none; 
            color: white; font-weight: bold; display: flex; align-items: center; 
            justify-content: center; gap: 8px; font-size: 15px; transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-viber { background: #7360f2; box-shadow: 0 4px 10px rgba(115, 96, 242, 0.3); }
        .btn-tg { background: #0088cc; box-shadow: 0 4px 10px rgba(0, 136, 204, 0.3); }
        
        .logout-btn { 
            background: rgba(255, 51, 51, 0.1); 
            border: 1px solid #ff3333;
            color: #ff3333; width: 100%; padding: 15px; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
            transition: 0.2s;
        }
        .logout-btn:active { background: #ff3333; color: white; transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        
        <div class="profile-img" id="sidebarProfileImg" style="overflow: hidden;">
            <img src="https://i.ibb.co/dJH3B61v/59693-Photoroom.png" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
        </div>
        <h2>M y   H u b</h2>
        <p>P l a y     w i t h     M e</p>
    </div>
        
    <div class="sidebar-links">
    <a href="index.html">
        <span class="icon"><i data-feather="home"></i></span> Home 
    </a>
    <a href="models.html" class="active">
        <span class="icon"><i data-feather="users"></i></span> Models
    </a>
    <a href="categories.html">
        <span class="icon"><i data-feather="film"></i></span> Categories
    </a>
    <a href="popular.html" style="color: #00ff88;">
        <span class="icon"><i data-feather="trending-up"></i></span> Popular
    </a>
    <a href="vip.html" style="color: gold;">
        <span class="icon"><i data-feather="award"></i></span> VIP Videos
    </a>
    
    <div style="border-top: 1px solid #333; margin: 15px 10px;"></div>
    
    <a href="login.html" id="navLogin" style="color: #00d2ff;">
        <span class="icon"><i data-feather="key"></i></span> Login
    </a>
    <a href="account.html" id="navAccount" class="active" style="display: none; color: #00ff88;">
        <span class="icon"><i data-feather="settings"></i></span> My Account
    </a>
    </div>
    </div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    

    <!-- Navbar -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h1 class="logo">My Account</h1>
    </div>

    <!-- Content -->
    <div class="account-container">
        <div class="profile-img">👤</div>
        
        <div class="info-box">
            <p>Username <span id="accUsername">...</span></p>
            <p>VIP Key <span id="accKey">******</span></p>
            <p>Expired <span id="accExpired" style="color: var(--primary);">...</span></p>
        </div>

        <div class="renew-box">
            <h3>Renew Key</h3>
            <p>အောက်ပါ Button များမှတဆင့် ဆက်သွယ်ပြီး Key သက်တမ်းတိုးနိုင်ပါသည်။</p>
            <div class="btn-group">
                <!-- Viber and Telegram Link-->
                <a href="viber://chat?number=+959xxxxxxxxx" class="btn btn-viber">📞 Viber</a>
                <a href="https://t.me/yourusername" class="btn btn-tg">✈️ Telegram</a>
            </div>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev"; // မင်း Worker Link
        
        // Account Page ကို ဝင်လာတာနဲ့ အချက်အလက်တွေ စစ်မယ်
        if (!localStorage.getItem('username')) {
            window.location.href = 'login.html'; // မဝင်ထားရင် Login ပို့မယ်
        } else {
            document.getElementById('navLogin').style.display = 'none';
            document.getElementById('navAccount').style.display = 'flex';
            document.getElementById('accUsername').innerText = localStorage.getItem('username');
            document.getElementById('accExpired').innerText = localStorage.getItem('expired_date');
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        async function logout() {
            const username = localStorage.getItem('username');
            const btn = document.querySelector('.logout-btn');
            
            btn.innerText = "Please Wait...";
            btn.disabled = true;

            // Delete Device ID
            try {
                await fetch(`${API_URL}/api/logout`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username })
                });
            } catch (e) { console.log(e); }

            
            localStorage.removeItem('username');
            localStorage.removeItem('expired_date');
            
            
            window.location.href = 'index.html';
        }
    </script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
